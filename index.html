<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>股票搜索</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: rgba(255, 255, 255, 0.88);
    --card-solid: #ffffff;
    --border: rgba(60, 60, 67, 0.12);
    --text: #111111;
    --text-dim: #6e6e73;
    --text-faint: #8e8e93;
    --accent: #007aff;
    --accent-soft: rgba(0, 122, 255, 0.12);
    --search-bg: rgba(118, 118, 128, 0.12);
    --shadow: 0 10px 30px rgba(17, 17, 17, 0.06);
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at top, rgba(0, 122, 255, 0.08), transparent 28%),
      linear-gradient(180deg, #f9f9fb 0%, var(--bg) 180px, var(--bg) 100%);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  .app {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 8px 14px 28px;
  }

  .topbar {
    padding: 8px 4px 14px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--accent);
    margin-bottom: 8px;
  }

  h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1.12;
    letter-spacing: -0.04em;
    font-weight: 700;
  }

  .subtitle {
    margin-top: 8px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-dim);
  }

  .search-card {
    margin-top: 14px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 24px;
    padding: 14px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--text-faint);
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 14px;
    background: var(--search-bg);
    color: var(--text);
    font-size: 16px;
    padding: 0 14px 0 42px;
    outline: none;
    transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  #searchInput::placeholder {
    color: var(--text-faint);
  }

  #searchInput:focus {
    background: #ffffff;
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .hint {
    min-width: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text-dim);
  }

  .count-pill {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 7px 11px;
    white-space: nowrap;
  }

  .section-title {
    margin: 18px 4px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.01em;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: 0 4px 16px rgba(17, 17, 17, 0.04);
  }

  .code {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    min-height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: #f5f5f7;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .name {
    font-size: 18px;
    line-height: 1.35;
    font-weight: 600;
    color: var(--text);
    word-break: break-all;
  }

  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 15px;
    line-height: 1.6;
    padding: 56px 16px;
    background: rgba(255, 255, 255, 0.54);
    border: 1px solid rgba(60, 60, 67, 0.08);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  @media (min-width: 700px) {
    .app {
      padding-left: 18px;
      padding-right: 18px;
    }

    .search-card {
      padding: 16px;
    }
  }

  @media (max-width: 480px) {
    .app {
      padding: 6px 12px 24px;
    }

    .topbar {
      padding: 4px 4px 12px;
    }

    h1 {
      font-size: 29px;
    }

    .subtitle {
      font-size: 14px;
    }

    .search-card {
      border-radius: 20px;
      padding: 12px;
    }

    #searchInput {
      height: 46px;
      font-size: 16px;
    }

    .row {
      border-radius: 18px;
      padding: 13px 14px;
      gap: 7px;
    }

    .name {
      font-size: 17px;
    }

    .meta-row {
      align-items: flex-start;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>股票搜索</h1>
  </header>

  <section class="search-card">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"></circle>
      </svg>
      <input id="searchInput" type="text" placeholder="搜索代码或名称" autocomplete="off" inputmode="search">
    </div>

    <div class="meta-row">
      <div class="hint" id="hintText">正在加载股票数据...</div>
      <div class="count-pill" id="countPill">—</div>
    </div>
  </section>

  <div class="section-title">搜索结果</div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="emptyState" hidden>没有找到匹配的股票</div>
</div>

<script>
  const DATA_URL = 'all_a_stocks.json';
  const RENDER_LIMIT = 300;

  let stocks = [
    { code: '000001', name: '平安银行' },
    { code: '000002', name: '万 科Ａ' }
  ];

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const hintEl = document.getElementById('hintText');
  const countPill = document.getElementById('countPill');

  function normalize(str) {
    return String(str)
      .replace(/\s+/g, '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .toLowerCase();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function parseLenient(text) {
    try {
      return JSON.parse(text);
    } catch (e1) {
      return JSON.parse(text.replace(/,(\s*[\]}])/g, '$1'));
    }
  }

  function render() {
    const q = normalize(searchInput.value.trim());
    const filtered = stocks.filter(item => {
      if (!q) return true;
      return normalize(item.code).includes(q) || normalize(item.name).includes(q);
    });

    countPill.textContent = `${filtered.length} 条匹配`;

    if (filtered.length === 0) {
      listEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }

    emptyEl.hidden = true;
    const truncated = filtered.length > RENDER_LIMIT;
    const toRender = truncated ? filtered.slice(0, RENDER_LIMIT) : filtered;

    listEl.innerHTML = toRender.map(item => `
      <li class="row">
        <span class="code">${escapeHtml(item.code)}</span>
        <span class="name">${escapeHtml(item.name)}</span>
      </li>
    `).join('') + (truncated ? `<li class="empty" style="padding:20px 16px;">仅显示前 ${RENDER_LIMIT} 条，请输入更具体的关键词</li>` : '');
  }

  let debounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  });

  async function loadData() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const parsed = parseLenient(text);
      if (!Array.isArray(parsed)) throw new Error('数据格式不是数组');

      const cleaned = parsed.filter(item => item && typeof item.code === 'string' && typeof item.name === 'string');
      if (cleaned.length === 0) throw new Error('没有解析到有效的股票数据');

      stocks = cleaned;
      hintEl.textContent = `已加载 ${stocks.length} 条股票数据`;
      render();
    } catch (err) {
      hintEl.textContent = `无法加载 ${DATA_URL}，当前显示示例数据：${err.message}`;
      render();
    }
  }

  loadData();
</script>
</body>
</html>
