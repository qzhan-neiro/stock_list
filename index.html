<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票搜索</title>
<style>
  :root {
    --bg: #11141a;
    --surface: #1a1e26;
    --surface-hover: #20252f;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #8b92a1;
    --text-faint: #565d6c;
    --accent-border: rgba(225, 75, 67, 0.45);
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(225, 75, 67, 0.08), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(225, 75, 67, 0.05), transparent 40%);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header { margin-bottom: 24px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .search-wrap { margin-bottom: 16px; }

  #searchInput {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: var(--sans);
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  #searchInput::placeholder { color: var(--text-faint); }

  #searchInput:focus {
    border-color: var(--accent-border);
    background: var(--surface-hover);
  }

  .hint {
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: background 0.15s ease;
  }

  .row:hover { background: var(--surface-hover); }

  .code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .name {
    font-size: 15px;
    color: var(--text);
    word-break: break-all;
  }

  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    padding: 60px 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Stocks</div>
    <h1>股票搜索</h1>
  </header>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="输入代码或名称搜索，如 000001 / 平安" autocomplete="off">
  </div>

  <div class="hint" id="hintText">正在加载股票数据...</div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="emptyState" hidden>没有找到匹配的股票</div>
</div>

<script>
  const DATA_URL = 'all_a_stocks.json';
  const RENDER_LIMIT = 300;

  let stocks = [
    { code: '000001', name: '平安银行' },
    { code: '000002', name: '万 科Ａ' }
  ];

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const hintEl = document.getElementById('hintText');

  function normalize(str) {
    return String(str)
      .replace(/\s+/g, '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .toLowerCase();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function parseLenient(text) {
    try {
      return JSON.parse(text);
    } catch (e1) {
      return JSON.parse(text.replace(/,(\s*[\]}])/g, '$1'));
    }
  }

  function render() {
    const q = normalize(searchInput.value.trim());
    const filtered = stocks.filter(item => {
      if (!q) return true;
      return normalize(item.code).includes(q) || normalize(item.name).includes(q);
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }

    emptyEl.hidden = true;
    const truncated = filtered.length > RENDER_LIMIT;
    const toRender = truncated ? filtered.slice(0, RENDER_LIMIT) : filtered;

    listEl.innerHTML = toRender.map(item => `
      <li class="row">
        <span class="code">${escapeHtml(item.code)}</span>
        <span class="name">${escapeHtml(item.name)}</span>
      </li>
    `).join('') + (truncated ? `<li class="empty" style="padding:20px 0;">仅显示前 ${RENDER_LIMIT} 条，请输入更具体的关键词</li>` : '');
  }

  let debounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  });

  async function loadData() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const parsed = parseLenient(text);
      if (!Array.isArray(parsed)) throw new Error('数据格式不是数组');

      const cleaned = parsed.filter(item => item && typeof item.code === 'string' && typeof item.name === 'string');
      if (cleaned.length === 0) throw new Error('没有解析到有效的股票数据');

      stocks = cleaned;
      hintEl.textContent = `共加载 ${stocks.length} 条股票数据`;
      render();
    } catch (err) {
      hintEl.textContent = `无法加载 ${DATA_URL}，当前显示示例数据：${err.message}`;
      render();
    }
  }

  loadData();
</script>
</body>
</html>
