<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票搜索</title>
<style>
  :root {
    --bg: #0b1220;
    --bg-2: #0f172a;
    --surface: rgba(17, 24, 39, 0.92);
    --surface-hover: rgba(23, 31, 48, 0.96);
    --border: rgba(148, 163, 184, 0.16);
    --border-strong: rgba(94, 234, 212, 0.32);
    --text: #e5eefc;
    --text-dim: #9aa7bd;
    --text-faint: #66748f;
    --accent: #5eead4;
    --accent-2: #60a5fa;
    --shadow: 0 16px 40px rgba(2, 6, 23, 0.34);
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    background:
      radial-gradient(circle at top left, rgba(96, 165, 250, 0.14), transparent 32%),
      radial-gradient(circle at 90% 8%, rgba(94, 234, 212, 0.12), transparent 28%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
  }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    background: transparent;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 44px 20px 84px;
  }

  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.82), rgba(17, 24, 39, 0.96));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px 22px 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }

  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(135deg, rgba(94, 234, 212, 0.08), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(96, 165, 250, 0.12), transparent 32%);
  }

  .eyebrow {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .eyebrow::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.08);
  }

  h1 {
    position: relative;
    z-index: 1;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0;
  }

  .subtitle {
    position: relative;
    z-index: 1;
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .search-wrap {
    margin: 18px 0 14px;
    position: relative;
  }

  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 16px;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    padding: 15px 16px 15px 42px;
    font-size: 15px;
    font-family: var(--sans);
    color: var(--text);
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid var(--border);
    border-radius: 16px;
    outline: none;
    transition: border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
  }

  #searchInput::placeholder { color: var(--text-faint); }

  #searchInput:hover {
    background: rgba(17, 24, 39, 0.92);
  }

  #searchInput:focus {
    border-color: var(--border-strong);
    background: rgba(17, 24, 39, 0.98);
    box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.08);
  }

  .hint-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .hint {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-dim);
  }

  .count-pill {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #b8fff3;
    background: rgba(94, 234, 212, 0.1);
    border: 1px solid rgba(94, 234, 212, 0.2);
    border-radius: 999px;
    padding: 6px 10px;
    white-space: nowrap;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(2, 6, 23, 0.16);
    transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
  }

  .row:hover {
    transform: translateY(-1px);
    background: var(--surface-hover);
    border-color: rgba(96, 165, 250, 0.22);
  }

  .code {
    display: inline-flex;
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 12px;
    color: #98a7c4;
    background: rgba(148, 163, 184, 0.09);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 999px;
    padding: 4px 8px;
    letter-spacing: 0.02em;
  }

  .name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.45;
    word-break: break-all;
  }

  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    padding: 64px 0;
  }

  .empty::before {
    content: '⌄';
    display: block;
    font-size: 26px;
    line-height: 1;
    margin-bottom: 10px;
    color: rgba(94, 234, 212, 0.5);
  }

  @media (max-width: 640px) {
    .app { padding: 18px 14px 64px; }
    .hero { border-radius: 18px; padding: 20px 16px 16px; }
    h1 { font-size: 26px; }
    #searchInput { border-radius: 14px; }
    .row { padding: 12px 14px; border-radius: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="eyebrow">Stocks</div>
    <h1>股票搜索</h1>
    <div class="subtitle">输入股票代码或名称，快速筛选你要找的股票。</div>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="输入代码或名称搜索，如 000001 / 平安" autocomplete="off">
    </div>

    <div class="hint-bar">
      <div class="hint" id="hintText">正在加载股票数据...</div>
      <div class="count-pill" id="countPill">—</div>
    </div>
  </section>

  <ul class="list" id="list" style="margin-top:16px;"></ul>
  <div class="empty" id="emptyState" hidden>没有找到匹配的股票</div>
</div>

<script>
  const DATA_URL = 'all_a_stocks.json';
  const RENDER_LIMIT = 300;

  let stocks = [
    { code: '000001', name: '平安银行' },
    { code: '000002', name: '万 科Ａ' }
  ];

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const hintEl = document.getElementById('hintText');
  const countPill = document.getElementById('countPill');

  function normalize(str) {
    return String(str)
      .replace(/\s+/g, '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .toLowerCase();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function parseLenient(text) {
    try {
      return JSON.parse(text);
    } catch (e1) {
      return JSON.parse(text.replace(/,(\s*[\]}])/g, '$1'));
    }
  }

  function render() {
    const q = normalize(searchInput.value.trim());
    const filtered = stocks.filter(item => {
      if (!q) return true;
      return normalize(item.code).includes(q) || normalize(item.name).includes(q);
    });

    countPill.textContent = `${filtered.length} 条匹配`;

    if (filtered.length === 0) {
      listEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }

    emptyEl.hidden = true;
    const truncated = filtered.length > RENDER_LIMIT;
    const toRender = truncated ? filtered.slice(0, RENDER_LIMIT) : filtered;

    listEl.innerHTML = toRender.map(item => `
      <li class="row">
        <span class="code">${escapeHtml(item.code)}</span>
        <span class="name">${escapeHtml(item.name)}</span>
      </li>
    `).join('') + (truncated ? `<li class="empty" style="padding:20px 0;">仅显示前 ${RENDER_LIMIT} 条，请输入更具体的关键词</li>` : '');
  }

  let debounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  });

  async function loadData() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const parsed = parseLenient(text);
      if (!Array.isArray(parsed)) throw new Error('数据格式不是数组');

      const cleaned = parsed.filter(item => item && typeof item.code === 'string' && typeof item.name === 'string');
      if (cleaned.length === 0) throw new Error('没有解析到有效的股票数据');

      stocks = cleaned;
      hintEl.textContent = `共加载 ${stocks.length} 条股票数据`;
      render();
    } catch (err) {
      hintEl.textContent = `无法加载 ${DATA_URL}，当前显示示例数据：${err.message}`;
      render();
    }
  }

  loadData();
</script>
</body>
</html>
