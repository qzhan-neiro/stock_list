<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票自选搜索</title>
<style>
  :root {
    --bg: #11141a;
    --surface: #1a1e26;
    --surface-hover: #20252f;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #8b92a1;
    --text-faint: #565d6c;
    --accent: #e14b43;
    --accent-dim: rgba(225, 75, 67, 0.14);
    --accent-border: rgba(225, 75, 67, 0.45);
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(225, 75, 67, 0.08), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(225, 75, 67, 0.05), transparent 40%);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header { margin-bottom: 28px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .search-wrap { margin-bottom: 8px; }

  .status-line {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 14px;
    min-height: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-line.error { color: var(--accent); }
  .status-line.ok { color: #5fbf7a; }

  .status-line button {
    background: none;
    border: none;
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    padding: 0;
  }

  #searchInput {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: var(--sans);
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  #searchInput::placeholder { color: var(--text-faint); }

  #searchInput:focus {
    border-color: var(--accent-border);
    background: var(--surface-hover);
  }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .chip {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .chip:hover { background: var(--surface-hover); color: var(--text); }

  .chip.active {
    background: var(--accent-dim);
    border-color: var(--accent-border);
    color: #ff7a72;
  }

  .chip.import-toggle {
    margin-left: auto;
    border-style: dashed;
  }

  .chip .count {
    font-family: var(--mono);
    color: inherit;
    opacity: 0.7;
    margin-left: 4px;
  }

  .import-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .import-panel textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 10px;
    outline: none;
  }

  .import-panel textarea:focus { border-color: var(--accent-border); }

  .import-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .import-actions button {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
  }

  #importBtn { background: var(--accent); color: #fff; font-weight: 600; }
  #importBtn:hover { background: #d23f37; }

  #importCancel { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  #importCancel:hover { color: var(--text); }

  .import-hint {
    margin-top: 8px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-faint);
    min-height: 14px;
  }

  .import-hint.error { color: var(--accent); }
  .import-hint.ok { color: #5fbf7a; }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 12px 14px;
    transition: background 0.15s ease;
  }

  .row:hover { background: var(--surface-hover); }

  .row.is-fav { border-left-color: var(--accent); }

  .star {
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: var(--text-faint);
    padding: 2px;
    flex-shrink: 0;
  }

  .row.is-fav .star { color: var(--accent); }

  .info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .name {
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent-border);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    padding: 60px 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Watchlist · 自选股</div>
    <h1>股票自选搜索</h1>
  </header>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="输入代码或名称搜索，如 000001 / 平安" autocomplete="off">
  </div>

  <div class="status-line" id="statusLine"></div>

  <div class="filter-row">
    <button class="chip active" data-filter="all">全部<span class="count" id="countAll"></span></button>
    <button class="chip" data-filter="fav">我的推荐<span class="count" id="countFav"></span></button>
    <button class="chip import-toggle" id="importToggle">导入数据</button>
  </div>

  <div class="import-panel" id="importPanel" hidden>
    <textarea id="importText" placeholder='粘贴股票JSON数组，例如：
[{"code":"000001","name":"平安银行"},{"code":"000002","name":"万科A","isFavorite":true}]'></textarea>
    <div class="import-actions">
      <button id="importBtn">导入并替换</button>
      <button id="importCancel">取消</button>
    </div>
    <div class="import-hint" id="importHint"></div>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="emptyState" hidden>没有找到匹配的股票</div>
</div>

<script>
  // 数据来源：默认从“统计”目录下的 all_a_stocks.json 读取
  // 如果你的目录结构不同，改这里的路径就行（相对路径是相对于本 html 文件的位置）
  const DATA_URL = 'all_a_stocks.json';
  const RENDER_LIMIT = 300; // 单次最多渲染多少行，避免全市场数据量太大导致卡顿

  // 在 all_a_stocks.json 加载失败时使用的兜底示例数据
  let stocks = [
    { code: "000001", name: "平安银行" },
    { code: "000002", name: "万  科Ａ", isFavorite: true }
  ];

  let currentFilter = 'all'; // 'all' | 'fav'

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const countAllEl = document.getElementById('countAll');
  const countFavEl = document.getElementById('countFav');
  const statusEl = document.getElementById('statusLine');

  function normalize(str) {
    return String(str)
      .replace(/\s+/g, '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .toLowerCase();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function render() {
    const q = normalize(searchInput.value.trim());

    const favCount = stocks.filter(s => s.isFavorite).length;
    countAllEl.textContent = `（${stocks.length}）`;
    countFavEl.textContent = `（${favCount}）`;

    let filtered = stocks.filter(s => {
      if (currentFilter === 'fav' && !s.isFavorite) return false;
      if (!q) return true;
      return normalize(s.code).includes(q) || normalize(s.name).includes(q);
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    const truncated = filtered.length > RENDER_LIMIT;
    const toRender = truncated ? filtered.slice(0, RENDER_LIMIT) : filtered;

    listEl.innerHTML = toRender.map(s => `
      <li class="row${s.isFavorite ? ' is-fav' : ''}">
        <button class="star" data-code="${escapeHtml(s.code)}" title="切换推荐" aria-label="切换推荐">${s.isFavorite ? '★' : '☆'}</button>
        <div class="info">
          <span class="code">${escapeHtml(s.code)}</span>
          <span class="name">${escapeHtml(s.name)}</span>
        </div>
        ${s.isFavorite ? '<span class="badge">推荐</span>' : ''}
      </li>
    `).join('') + (truncated ? `<li class="empty" style="padding:20px 0;">仅显示前 ${RENDER_LIMIT} 条（共匹配 ${filtered.length} 条），输入更具体的关键词缩小范围</li>` : '');
  }

  function toggleFavorite(code) {
    const s = stocks.find(s => s.code === code);
    if (s) s.isFavorite = !s.isFavorite;
    render();
  }

  listEl.addEventListener('click', e => {
    const btn = e.target.closest('.star');
    if (btn) toggleFavorite(btn.dataset.code);
  });

  let debounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  });

  document.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-filter]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      render();
    });
  });

  // 导入面板
  const importToggle = document.getElementById('importToggle');
  const importPanel = document.getElementById('importPanel');
  const importText = document.getElementById('importText');
  const importBtn = document.getElementById('importBtn');
  const importCancel = document.getElementById('importCancel');
  const importHint = document.getElementById('importHint');

  importToggle.addEventListener('click', () => {
    importPanel.hidden = !importPanel.hidden;
    importHint.textContent = '';
    importHint.className = 'import-hint';
  });

  importCancel.addEventListener('click', () => {
    importPanel.hidden = true;
    importText.value = '';
    importHint.textContent = '';
  });

  importBtn.addEventListener('click', () => {
    const raw = importText.value.trim();
    if (!raw) {
      importHint.textContent = '请先粘贴 JSON 数据';
      importHint.className = 'import-hint error';
      return;
    }
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e1) {
      // 容错：自动去掉多余的尾逗号后再尝试一次
      try {
        parsed = JSON.parse(raw.replace(/,(\s*[\]}])/g, '$1'));
      } catch (e2) {
        importHint.textContent = 'JSON 解析失败，请检查格式：' + e2.message;
        importHint.className = 'import-hint error';
        return;
      }
    }
    if (!Array.isArray(parsed)) {
      importHint.textContent = '数据需要是一个数组 [...]';
      importHint.className = 'import-hint error';
      return;
    }
    const cleaned = parsed.filter(item => item && typeof item.code === 'string' && typeof item.name === 'string');
    const skipped = parsed.length - cleaned.length;
    stocks = cleaned;
    importHint.textContent = `导入成功，共 ${cleaned.length} 条` + (skipped ? `，跳过 ${skipped} 条格式不正确的数据` : '');
    importHint.className = 'import-hint ok';
    importPanel.hidden = true;
    importText.value = '';
    render();
  });

  function setStatus(text, kind, withRetry) {
    statusEl.className = 'status-line' + (kind ? ' ' + kind : '');
    statusEl.innerHTML = escapeHtml(text) + (withRetry ? ' <button id="retryLoad">重试</button>' : '');
    if (withRetry) {
      document.getElementById('retryLoad').addEventListener('click', loadData);
    }
  }

  function parseLenient(text) {
    try {
      return JSON.parse(text);
    } catch (e1) {
      return JSON.parse(text.replace(/,(\s*[\]}])/g, '$1'));
    }
  }

  async function loadData() {
    setStatus(`正在加载 ${DATA_URL} …`, '');
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const parsed = parseLenient(text);
      if (!Array.isArray(parsed)) throw new Error('数据格式不是数组');
      const cleaned = parsed.filter(item => item && typeof item.code === 'string' && typeof item.name === 'string');
      if (cleaned.length === 0) throw new Error('没有解析到有效的股票数据');
      stocks = cleaned;
      setStatus(`已从 ${DATA_URL} 加载 ${cleaned.length} 条`, 'ok');
    } catch (err) {
      setStatus(
        `无法加载 ${DATA_URL}（${err.message}）。若是直接双击打开 html 文件，浏览器会拦截本地文件读取——请改用本地服务器打开（如在该目录运行 python -m http.server 后访问 http://localhost:8000），或用下方"导入数据"手动粘贴。当前显示的是示例数据。`,
        'error',
        true
      );
    }
    render();
  }

  loadData();
</script>
</body>
</html>
